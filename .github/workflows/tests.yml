name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        support:
          - { laravel: '11.0', testbench: '9.0' }
          - { laravel: '12.0', testbench: '10.0' }
          - { laravel: '13.0', testbench: '11.0' }
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pcntl
          coverage: none
      - name: Install matrix dependencies
        shell: bash
        run: |
          if [[ "${{ matrix.support.laravel }}" == "11.0" ]]; then
            # Every Laravel 11 release is covered by upstream advisories. Keep
            # compatibility coverage while preserving normal blocking elsewhere.
            composer require --dev "laravel/framework:^${{ matrix.support.laravel }}" "orchestra/testbench:^${{ matrix.support.testbench }}" --no-security-blocking --no-interaction --no-progress
          else
            composer require --dev "laravel/framework:^${{ matrix.support.laravel }}" "orchestra/testbench:^${{ matrix.support.testbench }}" --no-interaction --no-progress
          fi
      - run: composer validate --strict
      - run: vendor/bin/pest
      - run: vendor/bin/pint --test
